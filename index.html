<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El accidente</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .escena {
      display: none;
      min-height: 100vh;
      padding: 40px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .escena-activa {
      display: flex;
      flex-direction: column;
    }

    /* PORTÓN */

    #porton {
      position: relative;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.38)
        ),
        url("anya-chernykh-tvotQu_jd68-unsplash.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .contenido-porton {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1,
    h2 {
      margin: 0 0 12px;
    }

    h1 {
      font-size: 38px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: 1px solid white;
      border-radius: 999px;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    .credito-foto {
      position: absolute;
      right: 18px;
      bottom: 18px;
      margin: 0;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 12px;
    }

    .credito-foto a {
      color: white;
    }

    /* MAPA */

    #mapa {
      background: #111;
      color: white;
    }

    .contenido-mapa {
      width: min(1150px, 100%);
    }

    .texto-mapa {
      margin-bottom: 20px;
      opacity: 0.75;
    }

    #mapa-real {
      width: 100%;
      height: 72vh;
      border: 1px solid #444;
      overflow: hidden;
    }

    .punto-viajero {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #b00000;

      box-shadow:
        0 0 0 3px rgba(120, 0, 0, 0.25),
        0 0 14px rgba(150, 0, 0, 0.7);
    }

    .marca-roja {
      border-radius: 50%;
      background: #990000;
      opacity: 0.75;

      box-shadow:
        2px 5px 0 -2px rgba(120, 0, 0, 0.65);
    }

    /* PÉRDIDA DE SUSTANCIA */

    #perdida {
      background: #050505;
      color: white;
    }

    .texto-perdida {
      font-size: clamp(2.5rem, 9vw, 7rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      margin: 0;
    }
  </style>
</head>

<body>

  <main>

    <!-- ESCENA 1 -->
    <section class="escena escena-activa" id="porton">

      <div class="contenido-porton">

        <h1>El portón</h1>

        <p>Aquí comienza el recorrido.</p>

        <button id="entrar" type="button">
          Entrar
        </button>

      </div>

      <p class="credito-foto">
        Foto de
        <a
          href="https://unsplash.com/es/@anyachernykh"
          target="_blank"
          rel="noopener noreferrer"
        >
          Anya Chernykh
        </a>
        en
        <a
          href="https://unsplash.com/es/fotos/una-puerta-azul-con-una-cerradura-oxidada-tvotQu_jd68"
          target="_blank"
          rel="noopener noreferrer"
        >
          Unsplash
        </a>.
      </p>

    </section>


    <!-- ESCENA 2 -->
    <section class="escena" id="mapa">

      <div class="contenido-mapa">

        <h2>Recorrido</h2>

        <p class="texto-mapa">
          El trayecto.
        </p>

        <div id="mapa-real"></div>

      </div>

    </section>


    <!-- ESCENA 3 -->
    <section class="escena" id="perdida">

      <h2 class="texto-perdida">
        pérdida de sustancia
      </h2>

    </section>

  </main>


  <script>

    const botonEntrar =
      document.querySelector("#entrar");

    const porton =
      document.querySelector("#porton");

    const escenaMapa =
      document.querySelector("#mapa");

    const escenaPerdida =
      document.querySelector("#perdida");

    let mapaInicializado = false;


    botonEntrar.addEventListener(
      "click",
      function () {

        porton.classList.remove(
          "escena-activa"
        );

        escenaMapa.classList.add(
          "escena-activa"
        );

        if (!mapaInicializado) {

          crearMapa();

          mapaInicializado = true;

        }

      }
    );


    function mostrarPerdida() {

      escenaMapa.classList.remove(
        "escena-activa"
      );

      escenaPerdida.classList.add(
        "escena-activa"
      );

    }


    function crearMapa() {

      const coordenadasPorton = [
        14.643277895439471,
        -90.50234271356774
      ];

      const coordenadasHospital = [
        14.60393779846318,
        -90.56026555839702
      ];


      const mapa = L.map(
        "mapa-real",
        {
          zoomControl: false
        }
      );


      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
        {
          subdomains: "abcd",
          maxZoom: 20,

          attribution:
            '&copy; OpenStreetMap contributors ' +
            '&copy; CARTO'
        }
      ).addTo(mapa);


      const ruta = [

        coordenadasPorton,

        [14.6410, -90.5060],

        [14.6375, -90.5115],

        [14.6340, -90.5175],

        [14.6300, -90.5225],

        [14.6260, -90.5280],

        [14.6215, -90.5340],

        [14.6170, -90.5400],

        [14.6135, -90.5460],

        [14.6100, -90.5510],

        [14.6065, -90.5560],

        coordenadasHospital
      ];


      mapa.fitBounds(
        L.latLngBounds(ruta),
        {
          padding: [50, 50]
        }
      );


      L.polyline(
        ruta,
        {
          color: "#8b0000",
          weight: 3,
          opacity: 0.45
        }
      ).addTo(mapa);


      const iconoPunto =
        L.divIcon({

          className: "",

          html:
            '<div class="punto-viajero"></div>',

          iconSize: [18, 18],

          iconAnchor: [9, 9]

        });


      const punto =
        L.marker(
          coordenadasPorton,
          {
            icon: iconoPunto
          }
        ).addTo(mapa);


      let tramo = 0;

      let progreso = 0;

      const velocidad = 0.008;


      function animar() {

        if (
          tramo >=
          ruta.length - 1
        ) {

          window.setTimeout(
            mostrarPerdida,
            900
          );

          return;

        }


        const inicio =
          ruta[tramo];

        const final =
          ruta[tramo + 1];


        progreso += velocidad;


        const lat =
          inicio[0] +
          (
            final[0] -
            inicio[0]
          ) *
          progreso;


        const lng =
          inicio[1] +
          (
            final[1] -
            inicio[1]
          ) *
          progreso;


        punto.setLatLng(
          [lat, lng]
        );


        if (
          Math.random() >
          0.88
        ) {

          crearMarca(
            mapa,
            lat,
            lng
          );

        }


        if (
          progreso >= 1
        ) {

          progreso = 0;

          tramo++;

        }


        requestAnimationFrame(
          animar
        );

      }


      animar();

    }


    function crearMarca(
      mapa,
      lat,
      lng
    ) {

      const tamaño =
        5 +
        Math.random() * 8;


      const iconoMarca =
        L.divIcon({

          className: "",

          html:
            `
              <div
                class="marca-roja"
                style="
                  width:${tamaño}px;
                  height:${tamaño}px;
                "
              ></div>
            `,

          iconSize: [
            tamaño,
            tamaño
          ],

          iconAnchor: [
            tamaño / 2,
            tamaño / 2
          ]

        });


      L.marker(
        [
          lat +
          (
            Math.random() -
            0.5
          ) *
          0.00035,

          lng +
          (
            Math.random() -
            0.5
          ) *
          0.00035
        ],
        {
          icon: iconoMarca,
          interactive: false
        }
      ).addTo(mapa);

    }

  </script>

</body>
</html>
