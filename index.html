<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El accidente</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .escena {
      display: none;
      min-height: 100vh;
      padding: 40px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .escena-activa {
      display: flex;
      flex-direction: column;
    }

    /* ESCENA DEL PORTÓN */

    #porton {
      position: relative;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.38)
        ),
        url("anya-chernykh-tvotQu_jd68-unsplash.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .contenido-porton {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1,
    h2 {
      margin: 0 0 12px;
    }

    h1 {
      font-size: 38px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;

      border: 1px solid white;
      border-radius: 999px;

      background: transparent;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    .credito-foto {
      position: absolute;
      right: 18px;
      bottom: 18px;

      margin: 0;
      padding: 7px 10px;

      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);

      color: white;
      font-size: 12px;
    }

    .credito-foto a {
      color: white;
    }

    /* ESCENA DEL MAPA */

    #mapa {
      background: #0f0f0f;
      color: white;
    }

    .contenido-mapa {
      width: min(1100px, 100%);
    }

    .texto-mapa {
      margin-bottom: 20px;
    }

    #mapa-real {
      width: 100%;
      height: 70vh;

      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <main>

    <!-- ESCENA 1: PORTÓN -->
    <section class="escena escena-activa" id="porton">

      <div class="contenido-porton">

        <h1>El portón</h1>

        <p>
          Aquí comienza el recorrido.
        </p>

        <button id="entrar" type="button">
          Entrar
        </button>

      </div>

      <p class="credito-foto">
        Foto de
        <a
          href="https://unsplash.com/es/@anyachernykh"
          target="_blank"
          rel="noopener noreferrer"
        >
          Anya Chernykh
        </a>
        en
        <a
          href="https://unsplash.com/es/fotos/una-puerta-azul-con-una-cerradura-oxidada-tvotQu_jd68"
          target="_blank"
          rel="noopener noreferrer"
        >
          Unsplash
        </a>.
      </p>

    </section>


    <!-- ESCENA 2: MAPA -->
    <section class="escena" id="mapa">

      <div class="contenido-mapa">

        <h2>Recorrido hacia el hospital</h2>

        <p class="texto-mapa">
          En el trayecto queda una marca.
        </p>

        <div id="mapa-real"></div>

      </div>

    </section>

  </main>


  <script>
    const botonEntrar = document.querySelector("#entrar");
    const porton = document.querySelector("#porton");
    const mapa = document.querySelector("#mapa");

    let mapaInicializado = false;

    botonEntrar.addEventListener("click", function () {
      porton.classList.remove("escena-activa");
      mapa.classList.add("escena-activa");

      if (!mapaInicializado) {
        crearMapa();
        mapaInicializado = true;
      }
    });

    function crearMapa() {

      const coordenadasPorton = [
        14.643277895439471,
        -90.50234271356774
      ];

      const coordenadasHospital = [
        14.60393779846318,
        -90.56026555839702
      ];

      const mapaLeaflet = L.map("mapa-real").setView(
        [14.6235, -90.5313],
        13
      );

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(mapaLeaflet);

      L.marker(coordenadasPorton)
        .addTo(mapaLeaflet)
        .bindPopup("Portón");

      L.marker(coordenadasHospital)
        .addTo(mapaLeaflet)
        .bindPopup("Hospital");

      const ruta = [
        coordenadasPorton,
        [14.639, -90.507],
        [14.635, -90.514],
        [14.629, -90.519],
        [14.626, -90.526],
        [14.621, -90.531],
        [14.618, -90.537],
        [14.614, -90.543],
        [14.611, -90.548],
        [14.608, -90.553],
        [14.606, -90.557],
        coordenadasHospital
      ];

      L.polyline(
        ruta,
        {
          color: "white",
          weight: 4,
          opacity: 0.95
        }
      ).addTo(mapaLeaflet);

      const marcasRojas = [
        [14.637, -90.510],
        [14.632, -90.517],
        [14.624, -90.529],
        [14.617, -90.540],
        [14.610, -90.551]
      ];

      marcasRojas.forEach(function (punto, index) {

        L.circleMarker(
          punto,
          {
            radius: index % 2 === 0 ? 7 : 5,
            color: "#8b0000",
            fillColor: "#c00000",
            fillOpacity: 0.8,
            weight: 1
          }
        ).addTo(mapaLeaflet);

      });

    }
  </script>

</body>
</html>
</body>
</html>
