<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>El accidente</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .escena {
      display: none;
      min-height: 100vh;
      padding: 40px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .escena-activa {
      display: flex;
      flex-direction: column;
    }

    #porton {
      position: relative;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.38)
        ),
        url("anya-chernykh-tvotQu_jd68-unsplash.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .contenido-porton {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;

      border: 1px solid white;
      border-radius: 999px;

      background: transparent;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: black;
    }

    .credito-foto {
      position: absolute;
      right: 18px;
      bottom: 18px;

      margin: 0;
      padding: 7px 10px;

      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);

      color: white;
      font-size: 12px;
    }

    .credito-foto a {
      color: white;
    }

    #mapa {
      background: #e9e9e9;
      color: #111;
    }
  </style>
</head>

<body>

  <main>

    <!-- PORTÓN -->
    <section class="escena escena-activa" id="porton">

      <div class="contenido-porton">

        <h1>El portón</h1>

        <p>Aquí comienza el recorrido.</p>

        <button id="entrar" type="button">
          Entrar
        </button>

      </div>

      <p class="credito-foto">
        Foto de
        <a
          href="https://unsplash.com/es/@anyachernykh"
          target="_blank"
          rel="noopener noreferrer"
        >
          Anya Chernykh
        </a>
        en
        <a
          href="https://unsplash.com/es/fotos/una-puerta-azul-con-una-cerradura-oxidada-tvotQu_jd68"
          target="_blank"
          rel="noopener noreferrer"
        >
          Unsplash
        </a>.
      </p>

    </section>


    <!-- MAPA -->
    <section class="escena" id="mapa">

      <div>
        <h2>Recorrido hacia el hospital</h2>
        <p>Aquí aparecerá el mapa.</p>
      </div>

    </section>

  </main>


  <script>
    const botonEntrar = document.querySelector("#entrar");
    const porton = document.querySelector("#porton");
    const mapa = document.querySelector("#mapa");

    botonEntrar.addEventListener("click", function () {
      porton.classList.remove("escena-activa");
      mapa.classList.add("escena-activa");
    });
  </script>

</body>
</html>
